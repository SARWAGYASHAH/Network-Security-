name: CI-CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# =============================
# CONTINUOUS INTEGRATION
# =============================
jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint code
        run: echo "Linting repository"

      - name: Run unit tests
        run: echo "Running unit tests"

  # =============================
  # CONTINUOUS DELIVERY
  # Build & Push Docker Image
  # =============================
  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1   # ✅ MUMBAI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (GitHub runner)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: latest
        run: |
          set -eux
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # =============================
  # CONTINUOUS DEPLOYMENT
  # EC2 SELF-HOSTED RUNNER
  # =============================
  continuous-deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image
    runs-on: [self-hosted, linux, x64]

    # ✅ Region MUST be set explicitly on EC2
    env:
      AWS_REGION: ap-south-1   # ✅ MUMBAI

    steps:
      - name: Verify runner & Docker
        shell: bash
        run: |
          set -eux
          whoami
          pwd
          docker --version
          aws sts get-caller-identity

      # ✅ Uses EC2 IAM Role + AWS_REGION
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull latest image from ECR
        shell: bash
        run: |
          set -eux
          docker pull \
            ${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest

      - name: Stop and remove old container (if exists)
        shell: bash
        run: |
          docker stop networksecurity || true
          docker rm networksecurity || true

      - name: Run Docker container
        shell: bash
        run: |
          set -eux
          docker run -d \
            --restart unless-stopped \
            -p 8080:8080 \
            --name networksecurity \
            ${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest

      - name: Cleanup dangling Docker images
        shell: bash
        run: docker image prune -f
